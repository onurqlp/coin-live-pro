name: UzayX — Tüm sanal işlemleri kapat
run-name: Sanal işlemleri güncel fiyatla kapat · @${{ github.actor }}
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  close-and-publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/market.yml
    with:
      close_all: true
