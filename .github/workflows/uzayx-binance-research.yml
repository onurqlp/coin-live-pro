name: UzayX — Binance Historical Research
on:
  push:
    branches: [main]
    paths:
      - 'engine/uzayx_binance_archive.py'
      - 'engine/turan_replay.py'
      - 'engine/turan_rules.py'
      - 'tests/test_turan_replay.py'
      - 'scripts/uzayx_binance_coverage.py'
      - 'tests/test_uzayx_binance_coverage.py'
      - '.github/workflows/uzayx-binance-research.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 3,9,15,21 * * *'
permissions:
  contents: write
concurrency:
  group: uzayx-binance-history
  cancel-in-progress: false
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical source and timestamp contract
        run: |
          PYTHONPATH=engine python3 -m unittest discover -s tests -p test_uzayx_binance_archive.py
          python3 -m unittest discover -s tests -p test_uzayx_binance_coverage.py
          python3 -m unittest discover -s tests -p test_turan_replay.py
      - name: Collect bounded verified monthly futures research
        env:
          UZAYX_BINANCE_ARTIFACT_BUDGET: '16'
        run: |
          python3 engine/uzayx_binance_archive.py
          python3 scripts/uzayx_binance_coverage.py
          python3 engine/turan_replay.py
      - name: Persist historical checkpoint without publishing a trading signal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/binance-history research/turan-replay web/data/uzayx-binance-coverage.json web/data/turan-replay.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: incremental verified Binance futures history [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
