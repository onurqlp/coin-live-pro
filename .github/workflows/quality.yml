name: COIN.LIVE PRO — Quality
on:
  push:
    paths:
      - 'engine/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check web/app.js
      - run: node --check web/v4-ui.js
      - run: node --check web/watch-archive-ui.js
      - run: node --check web/legacy-reset.js
      - run: node --check web/pilot-ui.js
      - run: node --check web/router.js
      - run: node tests/verify.mjs
      - run: python3 -m py_compile engine/collector.py engine/mtf.py engine/swing.py engine/spark.py engine/forward.py engine/paper.py engine/health.py engine/v4_strategies.py engine/v4_lifecycle.py engine/v4_paper.py engine/v4_shadow.py engine/v4_forward.py engine/v4_oi.py engine/v4_lab.py engine/v4_publication.py engine/v4_historical.py engine/v4_anomaly.py engine/v4_context.py engine/v4_watch_archive.py
      - run: python3 -m unittest discover -s tests -v