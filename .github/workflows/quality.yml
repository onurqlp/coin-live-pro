name: COIN.LIVE PRO — Quality
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check web/chart-indicators.js
      - run: node tests/chart-indicators.test.mjs
      - run: node --check web/chart-guidance.js
      - run: node tests/chart-guidance.test.mjs
      - run: node --check web/app.js
      - run: node --check web/uzayx/app.js
      - run: node --check web/uzayx/charts.js
      - run: node --check web/uzayx/archive.js
      - run: node --check web/uzayx/watch.js
      - run: node --check web/uzayx/portfolio.js
      - run: node --check web/uzayx/support-proof.js
      - run: node --test tests/uzayx-support-proof.test.cjs
      - run: node --test tests/uzayx-watchdesk.test.cjs
      - run: node --test tests/uzayx-chart-archive.test.cjs
      - run: node --check web/v4-ui.js
      - run: node --check web/watch-archive-ui.js
      - run: node --check web/legacy-reset.js
      - run: node --check web/pilot-ui.js
      - run: node --check web/router.js
      - run: node tests/verify.mjs
      - run: python3 -m py_compile engine/collector.py engine/mtf.py engine/swing.py engine/spark.py engine/forward.py engine/paper.py engine/health.py engine/v4_strategies.py engine/v4_lifecycle.py engine/v4_paper.py engine/v4_shadow.py engine/v4_forward.py engine/v4_oi.py engine/v4_lab.py engine/v4_publication.py engine/v4_historical.py engine/v4_anomaly.py engine/v4_context.py engine/v4_watch_archive.py engine/v4_early.py engine/v4_spark_paper.py engine/v4_spark_review.py
      - run: cp integrations/google-v4-sync.gs /tmp/coin-live-v4-sync.js && node --check /tmp/coin-live-v4-sync.js
      - run: python3 -m py_compile scripts/quant_report.py scripts/watchdog.py
      - run: python3 -m unittest discover -s tests -v
      - name: Seven-day archived-ledger continuity smoke (no external services)
        run: |
          python3 scripts/uzayx_week_guard.py baseline
          python3 scripts/uzayx_week_guard.py verify