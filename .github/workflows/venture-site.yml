name: MAKINE 2.0 — Partner Presentation Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/fikir-laboratuvari/**'
      - '.github/workflows/venture-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/fikir-laboratuvari/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate retained partner page (normal Pages workflow publishes web/)
        run: |
          test -s web/fikir-laboratuvari/index.html
          test -s web/fikir-laboratuvari/style.css
          test -s web/fikir-laboratuvari/models.js
          test -s web/fikir-laboratuvari/app.js
          node --check web/fikir-laboratuvari/models.js
          node --check web/fikir-laboratuvari/app.js
