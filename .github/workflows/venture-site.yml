name: MAKINE 2.0 — Partner Presentation Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/fikir-laboratuvari/**"
      - ".github/workflows/venture-site.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coin-live-pro-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Quick static validation
        run: |
          test -s web/fikir-laboratuvari/index.html
          test -s web/fikir-laboratuvari/style.css
          test -s web/fikir-laboratuvari/models.js
          test -s web/fikir-laboratuvari/app.js
          node --check web/fikir-laboratuvari/models.js
          node --check web/fikir-laboratuvari/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy full site including partner presentation
        id: deploy
        uses: actions/deploy-pages@v4
