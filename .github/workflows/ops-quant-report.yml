name: COIN.LIVE — Daily Quant Evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'
    - cron: '41 2 * * 1'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Daily / weekly 7-14-30-90 day forward-only evidence
        run: python3 scripts/quant_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: quant-evidence-${{ github.run_id }}
          path: web/data/ops-report.json
          retention-days: 30
