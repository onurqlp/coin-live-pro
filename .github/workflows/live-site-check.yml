name: COIN.LIVE PRO — Live Site Verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-site-check.yml'
      - 'web/index.html'
      - 'web/app.js'
      - 'web/live-radar.js'
      - 'web/pilot-ui.js'
      - 'web/router.js'
      - 'web/style.css'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Allow parallel Pages deployment to finish
        run: sleep 30
      - name: Verify deployed root and all four market JSON files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://onurqlp.github.io/coin-live-pro
          for i in 1 2 3 4 5 6; do
            if curl -fSL --max-time 12 "$ROOT/?check=$(date +%s)" -o /tmp/site.html; then break; fi
            sleep 5
          done
          grep -q 'id="radarRows"' /tmp/site.html
          grep -q 'id="historyRows"' /tmp/site.html
          grep -q 'id="candleChart"' /tmp/site.html
          grep -q 'id="scanStatus"' /tmp/site.html
          grep -q 'live-radar.js' /tmp/site.html
          grep -q 'pilot-ui.js' /tmp/site.html
          grep -q 'router.js' /tmp/site.html
          grep -q 'id="workspaceNav"' /tmp/site.html
          grep -q 'id="chartHostRadar"' /tmp/site.html
          grep -q 'id="chartHostAdvanced"' /tmp/site.html
          grep -q 'id="chartQuickFrames"' /tmp/site.html
          grep -q 'id="swingHistoryRows"' /tmp/site.html
          grep -q 'id="forwardRows"' /tmp/site.html
          grep -q 'id="routeStatus"' /tmp/site.html
          grep -q 'id="mtfCandidates"' /tmp/site.html
          grep -q 'id="paperKpis"' /tmp/site.html
          grep -q 'id="systemKpis"' /tmp/site.html
          for n in market radar history reports mtf paper health swing-radar swing-history swing-outcomes; do
            curl -fSL --max-time 15 "$ROOT/data/$n.json?check=$(date +%s)" -o "/tmp/$n.json"
          done
          python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          data={n:json.loads(Path(f'/tmp/{n}.json').read_text()) for n in ['market','radar','history','reports','mtf','paper','health','swing-radar','swing-history','swing-outcomes']}
          assert len(data['market'].get('rows',[]))>=20,'market list incomplete'
          swing=data['swing-radar']
          assert swing['model_version'] in ('2.3.0-htf-sparks','2.4.0-htf-sparks','3.0.0-htf-sparks'),'Old 15m spark source used instead of 1D/4H'
          assert swing['timeframes_primary']==['1D','4H'],'Primary timeframe mismatch'
          assert swing['source_mtf_at']==data['mtf']['fetched_at'],'Macro scanner source mismatch'
          assert all(x['primary_tf'] in ('1D','4H') and x['confirmation']['1D'] and x['confirmation']['4H']
                     for x in swing['items']), 'Low-timeframe alert promoted without 1D+4H'
          assert all(x['stage']!='CONFIRMED' or all(x['confirmation'][tf] for tf in (('1H','15m') if swing['model_version'] in ('2.4.0-htf-sparks','3.0.0-htf-sparks') else ('1H','15m','5m','1m')))
                     for x in swing['items']),'Confirmation missing closed hourly/15m candle'
          assert all(e['is_executed_trade'] is False and e['realized_R'] is None
                     for e in data['swing-history']['events']),'Forward-only spark history falsified'
          print('HTF_SPARKS_OK',len(swing['items']),'confirmed',swing['confirmed'],
                'forward_events',len(data['swing-history']['events']))

          assert data['market'].get('analysis_attempted',0)>=30,'15m scan queue underfilled'
          assert data['market'].get('analysis_ok',0)>=20,'insufficient closed 15m/1H/4H validation'
          attempted=data['market']['analysis_attempted']
          successful=data['market']['analysis_ok']
          print('TECHNICAL_COVERAGE',successful,'/',attempted)
          if successful<attempted:print('CAUTION: partial coverage; missing coins are NOT confirmed')
          assert isinstance(data['history'].get('events'),list),'history not served'
          assert len(data['reports'].get('reports',[]))==2,'7/14 report not served'
          assert data['mtf']['analyzed']>=3,'real seven-timeframe scan not deployed'
          assert all(set(x['frames'])>=set(['1W','1D','12H','4H','1H','15m','5m']) for x in data['mtf']['candidates']),'incomplete MTF context'
          assert data['swing-outcomes']['model_version']=='3.0.0-forward-observation','v3 forward audit not published'
          assert data['swing-outcomes']['no_legacy_backfill'],'legacy observations must not be treated as v3'
          assert data['paper']['starting_usdt']==100 and data['paper']['pilot_started_at'],'forward-only pilot missing'
          assert data['health']['last_scan_id'] and 'schedule_proven' in data['health'],'audit missing'
          now=datetime.datetime.now(datetime.timezone.utc)
          updated=datetime.datetime.fromisoformat(data['history']['updated_at'])
          age=(now-updated).total_seconds()/60
          print('LIVE_SITE_OK | provider=',data['market'].get('provider'),'coins=',len(data['market']['rows']),'events=',len(data['history']['events']),'snapshot_age_minutes=',round(age,1))
          if age>30:print('CAUTION: Published data is stale; scheduled refresh requires attention')
          PY
      - name: Verify real DOM rendering in Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Chrome unavailable"; exit 1; fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=26000 --dump-dom https://onurqlp.github.io/coin-live-pro/ > /tmp/dom.html 2>/tmp/chrome.log
          python3 - <<'PY'
          import re
          doc=open('/tmp/dom.html').read()
          for key in ('marketCount','healthTitle','radarRows','historyRows','reportStats','chartCoin','scanStatus','browserHistory','chartTf','mtfCandidates','mtfStatus','paperKpis','paperStatus','systemKpis','systemStatus'):
            match=re.search(r'id="'+key+r'"[^>]*>(.*?)</',doc,re.S)
            assert match is not None,'missing '+key
            excerpt=re.sub('<[^>]*>',' ',match.group(1)).strip()[:160]
            print(key,'=',excerpt)
          assert 'Veriler kontrol ediliyor' not in doc.split('id="source"')[1][:120],'render did not start'
          match=re.search(r'id="scanStatus"[^>]*>(.*?)</',doc,re.S)
          assert match and 'hazırlanıyor' not in match.group(1),'independent live scanner never started'
          print('LIVE_SCANNER_STATUS',re.sub('<[^>]*>',' ',match.group(1)).strip()[:180])
          for key in ('mtfCandidates','paperKpis','systemKpis'):
            m=re.search(r'id="'+key+r'"[^>]*>(.*?)</',doc,re.S)
            assert m and m.group(1).strip(),'V2 widget failed to render: '+key
          routes=['radar','grafikler','portfoy','gecmis','rapor','sistem']
          for route in routes:
            assert 'href="#'+route+'"' in doc,'Missing route '+route
            assert 'data-view="'+route+'"' in doc,'Missing view '+route
          current=re.search(r'<main class="workspaceView" data-view="radar"[^>]*>',doc)
          assert current and 'aria-hidden="false"' in current.group(0),'Initial Radar route not active'
          print('BROWSER_DOM_PASS: six-route navbar, shared central data loaded')
          PY

      - name: Open multiple routes and verify active panel changes
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium)
          ROOT=https://onurqlp.github.io/coin-live-pro/
          for route in grafikler portfoy gecmis rapor sistem; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "${ROOT}#${route}" > /tmp/route.html 2>/dev/null
            ROUTE="$route" python3 - <<'PY'
          import os,re
          route=os.environ['ROUTE']
          doc=open('/tmp/route.html').read()
          selected=re.search(r'<main class="workspaceView" data-view="'+route+r'"[^>]*>',doc)
          assert selected,route+' missing panel'
          assert ' hidden' not in selected.group(0).replace('aria-hidden','aria_hidden') and 'aria-hidden="false"' in selected.group(0),route+' not visible'
          for other in ('radar','grafikler','portfoy','gecmis','rapor','sistem'):
            panel=re.search(r'<main class="workspaceView" data-view="'+other+r'"[^>]*>',doc)
            assert panel
            if other!=route:assert ' hidden' in panel.group(0).replace('aria-hidden','aria_hidden') and 'aria-hidden="true"' in panel.group(0),other+' not hidden'
          active=re.search(r'<a[^>]+data-nav="'+route+r'"[^>]*>',doc)
          assert active and 'aria-current="page"' in active.group(0),'navigation highlight absent'
          print('ROUTE_OK',route)
          PY
          done
