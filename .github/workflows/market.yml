name: UZAYX — TURAN 200 Learning & Paper Archive
# Final publish: TURAN combined 230 registry, verified-identity top 30, 1H coin/time drilldowns and same mobile web.
# Release: TURAN dynamic Top30 from 230 candidates, source-verified 1H coin/time outcomes, ID-gated paper PnL.
# Final 19 Oct 2026 release: independent ATLAS, TURAN 30+200, reconciled virtual money details, shared PWA responsive polish.
# Release 2026-10-19 UX: reconciled paper stake/net PnL, 30+200 TURAN catalogs, preserved ATLAS, same PWA/web HTML.
# Deploy UZAYX TURAN 200-family archive and interactive research UI; retain 30 existing and independent ATLAS.
# UZAYX Pages publish: TURAN research 200-family interactive catalogue (source upload 2026-10-19); ATLAS and original 30 preserved.
# Release TURAN v3 details: 30 strategies, 7 documented source-model observations, filter/expand controls, ATLAS separate, web/PWA shared.
# Deploy TURAN v2: 30 explainable expandable strategies, verified observational states, independent ATLAS and responsive PWA.
# Publish separated TURAN/ATLAS tabs, 30 strategy hypotheses and app refresh UI.
# Publish simplified shared mobile and web UX, preserve all historical and background data.
# Publish network-first synchronized UZAYX web and installed application.
# Deploy shared responsive site.html embedded in website and PWA iframe, preserving all buttons and routes.
# Release: TURAN research layer contains preserved operational ATLAS; unified mobile/web interface.
# Deploy restored preferred app homepage and coordinated web landing.
# Refresh Pages: unified installed app and website; standalone verified candle charts.
# Deployment refresh for UZAYX kasa, V4 archive and TURAN naming; no trading rule changes.
on:
  workflow_call:
    inputs:
      close_all:
        description: Close all active virtual positions once, preserve PnL and publish
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      close_all:
        description: Tüm açık sanal işlemleri güncel fiyatla kapat
        type: boolean
        required: false
        default: false
  # GitHub scheduler is best-effort. An event=schedule run must be observed;
  # code pushes and workflow_dispatch alone DO NOT prove unattended refresh.
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - '.github/workflows/market.yml'
      - 'scripts/uzayx_pnl_report.py'
      - 'web/uzayx/app.js'
      - 'web/uzayx/site.html'
      - 'web/uzayx/finish.css'
      - 'web/release.json'
      - 'web/uzayx/release.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coin-live-pro-pages
  cancel-in-progress: ${{ startsWith(github.event.head_commit.message || '', '[skip-google]') }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Timestamp 5-minute best-effort scan
        run: echo "TRIGGER=${{ github.event_name }} UTC=$(date -u +%FT%TZ)"
      - name: Verify TURAN timing, attribution and immutable experiment contracts
        run: python3 -m unittest discover -s tests -p 'test_turan*.py'
      - name: Freeze previous published paper and watch counters
        run: python3 scripts/uzayx_week_guard.py baseline
      - name: One-time audited paper cash epoch cutover, keeping full prior books
        run: python3 scripts/uzayx_epoch_cutover.py
      - name: Read-only OKX crypto market quote universe (legacy 15m signals OFF)
        run: python3 engine/collector.py
      - name: Audit and close all prior virtual positions at current executable-side quotes
        env:
          UZAYX_CLOSE_REQUEST_ID: ${{ inputs.close_all && format('uzayx-manual-{0}', github.run_id) || '' }}
        run: python3 engine/uzayx_cash_close.py
      - name: Read-only RSS/social context (never trading confirmation)
        run: |
          python3 engine/v4_context.py || python3 - <<'PY'
          import datetime,json,pathlib
          p=pathlib.Path('web/data/v4-context.json')
          q=pathlib.Path('archive/v4-context-ledger.json');q.parent.mkdir(exist_ok=True,parents=True)
          q.write_text(json.dumps({'model_version':'4.0.0-context-research-a1','events':[], 'sources':{'all':'UNAVAILABLE'}}))
          p.write_text(json.dumps({'model_version':'4.0.0-context-research-a1',
              'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source_status':{'all':'UNAVAILABLE'},'latest_items':[],'observations':{},
              'score_not_used_for_paper_or_v4_stage':True}))
          PY
      - name: Build verified UTC-aligned seven-timeframe research
        run: python3 engine/mtf.py
      - name: Evaluate all 200 strategy roles; block missing sources and record NO_TRADE
        run: python3 engine/uzayx_strategy_bank.py
      - name: Record central DAILY / 4H sparks; 1H/15m confirmation, 1m optional
        run: python3 engine/spark.py
      - name: Record separately timestamped OI snapshots
        run: python3 engine/v4_oi.py
      - name: Evolve V4 discovery / motion / spotlight forward-only states
        run: python3 engine/v4_lifecycle.py
      - name: Manage separate V4 10k read-only paper account
        run: python3 engine/v4_paper.py
      - name: Independent all-eligible shadow study
        run: python3 engine/v4_shadow.py
      - name: Observe forward V4 1H / 4H / 24H / 3D / 7D horizons
        run: python3 engine/v4_forward.py
      - name: Persist all WATCH first-sightings and forward checkpoints
        run: python3 engine/v4_watch_archive.py
      - name: Publish generous independent early LONG SHORT research alerts
        run: python3 engine/v4_early.py
      - name: Open independent virtual tickets for every NEW spark and settle on later 5m bars
        run: python3 engine/v4_spark_paper.py
      - name: Compare 1-2-3 stage strategy outcomes against frozen signal indicators
        run: python3 engine/v4_spark_review.py
      - name: Learn from independent archive episodes and freeze prospective predictions
        run: python3 engine/uzayx_adaptive.py
      - name: Compute V4 7/14/30/90 day research lab
        run: python3 engine/v4_lab.py
      - name: Evaluate forward-only 3.0 observations on fully closed 4H candles
        run: python3 engine/forward.py
      - name: Track 3.0-only 100 USDT paper pilot
        run: python3 engine/paper.py
      - name: Record actual scan source and missed cron intervals
        run: python3 engine/health.py
      - name: Stamp unified V4 data manifest with source file hashes
        run: python3 engine/v4_publication.py
      - name: Verify self-consistency; fail closed
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('web/data')
          files={s:json.loads((p/f'{s}.json').read_text()) for s in ['market','mtf','paper','health','swing-radar','swing-history','swing-outcomes']}
          now=datetime.datetime.now(datetime.timezone.utc)
          assert len(files['market']['rows']) >= 30
          assert all(x['provider']=='OKX' for x in (files['market'],files['mtf'],files['swing-radar']))
          for key,field in [('market','fetched_at'),('mtf','fetched_at'),('paper','updated_at'),('health','updated_at'),('swing-radar','fetched_at'),('swing-history','updated_at'),('swing-outcomes','updated_at')]:
            age=(now-datetime.datetime.fromisoformat(files[key][field])).total_seconds()
            assert 0<=age<=480,(key,age)
          assert files['market']['model_version']=='3.0.0-market-quotes','legacy market collector in use'
          assert files['market']['analysis_attempted']==0,'legacy 15m OHLC scan not retired'
          for old in ('history','radar','reports'):
            retired=json.loads((p/f'{old}.json').read_text())
            assert retired.get('retired') is True,'retired data source active: '+old
            assert not retired.get('events',[]) and not retired.get('items',[]) and not retired.get('reports',[]),'old 15m signals reappeared: '+old
          assert files['mtf']['analyzed']>=3,'macro context insufficient'
          assert files['swing-radar']['model_version']=='3.0.0-htf-sparks','wrong high-TF radar model'
          assert files['mtf']['model_version']=='3.0.0-mtf-swing','outdated HTF score'
          assert files['swing-radar']['timeframes_primary']==['1D','4H'],'15m must not become primary'
          assert files['swing-radar']['source_mtf_at']==files['mtf']['fetched_at'],'wrong MTF snapshot source'
          assert files['swing-radar'].get('filter_policy')=='3.1-persistent-quant-20261016','old quant model published'
          assert all(x.get('review_state') in ('FRESH','RECHECK_PENDING','INVALIDATED')
                     for x in files['swing-radar']['items']),'spark lifecycle missing'
          assert all(x.get('review_state')=='FRESH' or x.get('stage')!='CONFIRMED'
                     for x in files['swing-radar']['items']),'stale carried confirmation'
          assert all('rsi_14' in x.get('frames',{}).get('4H',{})
                     for x in files['mtf']['candidates'] if x.get('quality')=='COMPLETE'),'closed RSI absent'
          assert all('macd_12_26_9' in x.get('frames',{}).get('4H',{})
                     for x in files['mtf']['candidates'] if x.get('quality')=='COMPLETE'),'closed MACD absent'
          assert len({e['event_id'] for e in files['swing-history']['events']})==len(files['swing-history']['events']),'duplicate forward sparks'
          assert all(x['primary_tf'] in ('1D','4H') and x['quality']=='VERIFIED_CLOSED_1D_4H'
                     for x in files['swing-radar']['items']),'legacy 15m spark entered HTF radar'
          assert all(x['confirmation']['1D'] and x['confirmation']['4H']
                     for x in files['swing-radar']['items']),'higher TF alignment missing'
          assert all(x['stage']!='CONFIRMED' or
                     all(x['confirmation'][frame] for frame in ('1W','1H','15m','5m'))
                     for x in files['swing-radar']['items']),'invalid micro confirmation'
          assert all(x.get('stage')!='CONFIRMED' or
                     (x.get('entry_timing')=='STRICT_CONFIRMED'
                      and x.get('filter_policy')=='3.1-persistent-quant-20261016'
                      and x.get('review_state')=='FRESH'
                      and x.get('extended_from_4h_breakout_pct',-999)>0
                      and not x.get('strict_gate_reasons'))
                     for x in files['swing-radar']['items']),'unverified strict confirmation'
          assert all(not e['is_executed_trade'] and e['realized_R'] is None
                     for e in files['swing-history']['events']),'research observations pretended to be fills'
          assert files['swing-outcomes']['model_version']=='3.0.0-forward-observation','forward audit model missing'
          assert files['swing-outcomes']['no_legacy_backfill'],'old events cannot be backfilled'
          assert all(not x['is_executed_trade'] and x['realized_R'] is None
                     for x in files['swing-outcomes']['events']),'forward tracker claimed real trades'
          assert files['paper']['model_version']=='3.0.0-paper-swing','old paper engine used'
          assert files['paper']['legacy_micro_positions_preserved']==0,'old paper orders leaked'
          assert all(e.get('model_version')=='3.0.0-htf-sparks' for e in files['swing-history']['events']),'old history leaked'
          assert files['paper']['starting_usdt']==100,'pilot balance changed'
          assert files['health']['last_scan_id'],'missing scan provenance'
          required=('v4-oi','v4-radar','v4-paper','v4-shadow','v4-forward','v4-watch-archive','v4-early','v4-spark-paper','v4-spark-review','v4-context','v4-lab','v4-manifest')
          v4={name:json.loads((p/f'{name}.json').read_text()) for name in required}
          sid=v4['v4-manifest']['scan_id']
          assert v4['v4-manifest']['publication_valid'] is True
          assert all(v4[name].get('scan_id')==sid for name in ('v4-radar','v4-paper','v4-shadow','v4-forward','v4-watch-archive','v4-early','v4-spark-paper','v4-spark-review','v4-lab'))
          assert v4['v4-early']['research_only'] is True and v4['v4-early']['no_paper_entries'] is True
          assert v4['v4-spark-paper']['no_real_orders'] and not v4['v4-spark-paper']['combined_with_strict_paper_cash']
          assert v4['v4-spark-paper']['archive_is_persistent'] is True
          assert 'today' in v4['v4-spark-paper']['daily']
          assert v4['v4-spark-paper']['daily']['timezone']=='UTC'
          assert v4['v4-spark-paper']['geldi_intent_total']>=sum(
              x.get('entry_class')=='GELDI' for x in v4['v4-spark-paper']['recent_tickets']), 'recent sample cannot exceed cumulative GELDI count'
          assert (len(v4['v4-spark-paper']['recent_tickets']) >= 220 or
                  v4['v4-spark-paper']['geldi_intent_total']==sum(
                  x.get('entry_class')=='GELDI' for x in v4['v4-spark-paper']['recent_tickets'])), 'untruncated GELDI count mismatch'
          assert all(x.get('paper_intent_created') and not x.get('is_real_trade')
              and x.get('signal_at_utc') for x in v4['v4-spark-paper']['recent_tickets']
              if x.get('entry_class')=='GELDI')
          assert v4['v4-spark-review']['needs_out_of_sample_validation'] is True
          assert v4['v4-spark-review']['new_rules_applied_automatically'] is False
          assert v4['v4-paper']['starting_balance_usdt']==10000
          assert v4['v4-paper']['legacy_v3_balance_included'] is False
          assert v4['v4-paper']['no_real_orders'] is True
          assert v4['v4-shadow']['combined_with_main_cash'] is False
          assert v4['v4-oi']['source_mtf_at']==files['mtf']['fetched_at']
          assert set(v4['v4-radar']['counts']) >= {'spotlight','motion','watch','active_total'}
          from pathlib import Path
          release=json.loads(Path('web/release.json').read_text())
          assert release['product_version'].startswith('4.') and release['product_version'][2:].isdigit() and release['version_change_owner']=='AUTOMATIC_MINOR_WITHIN_4' and release['major_version_5_requires_user_approval'] is True
          study=v4['v4-radar'].get('anomaly_research',{})
          assert study.get('not_used_in_v4_score') is True
          assert study.get('no_real_orders') is True
          assert study.get('clock',{}).get('window_is_not_manipulation_evidence') is True
          assert study.get('hourly',{}).get('not_an_empirical_manipulation_probability') is True
          assert all(x.get('state') in ('OBSERVED_HEURISTIC','UNKNOWN') for x in study.get('pairs',{}).values())
          assert all(x.get('not_proof') is True for x in study.get('pairs',{}).values())
          assert len(v4['v4-radar']['spotlight']) <= 5
          assert all(x.get('review_state')=='FRESH' for x in v4['v4-radar']['spotlight'])
          print('Verified V4 scan',sid,'three stages + isolated 10k ledger, shadow and report') 
          print('Verified: 100-pair public radar, scanned',files['market']['analyzed'],'v3 events',len(files['swing-history']['events']),'and clean forward audit')
          PY
      - name: Validate closed-candle chart fallback
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('web/data')
          pack=json.loads((root/'chart-pack.json').read_text())
          mtf=json.loads((root/'mtf.json').read_text())
          assert pack['schema_version']==1 and pack['source']=='OKX_CLOSED_CANDLES'
          assert pack['source_mtf_at']==mtf['fetched_at']==pack['fetched_at']
          assert pack['chart_only'] is True and pack['no_real_orders'] is True
          valid={row['symbol'] for row in mtf['candidates']}
          assert valid==set(pack['candles_by_symbol'])
          for symbol,frames in pack['candles_by_symbol'].items():
              for tf,rows in frames.items():
                  assert tf in ('1W','1D','12H','4H','1H','15m','5m')
                  assert len(rows)<=60 and all(len(row)==6 for row in rows)
                  assert all(rows[i][0]<rows[i+1][0] for i in range(len(rows)-1))
          print('Verified chart-only closed-candle pack:',len(valid),'symbols')
          PY
      - name: Refuse ledger/history regression or mismatched scans
        run: python3 scripts/uzayx_week_guard.py verify
      - name: Record isolated prospective TURAN research and complete cash attribution
        run: python3 engine/uzayx_research.py
      - name: Produce independent forward-evidence ops report (non-blocking)
        run: |
          if python3 scripts/quant_report.py; then
            echo "Supplementary report regenerated from verified market data"
          else
            echo "::warning::Supplementary report failed; core market publication continues"
          fi
      - name: Reconcile all strategy and paper account PNL by full ledger
        run: |
          python3 -m unittest discover -s tests -p test_uzayx_pnl_report.py
          python3 scripts/uzayx_pnl_report.py
      - name: Build TURAN independent evidence index and append-only learning journal
        run: |
          python3 engine/turan_experiments.py
          python3 engine/turan_core.py
      - name: Refresh UzayX Google summary from this verified scan
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', '[skip-google]') }}
        run: python3 scripts/uzayx_google_export.py
      - name: Publish only validated data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f web/data/ops-report.json ]; then git add web/data/ops-report.json; fi
          git add web/data/market.json
          git add web/data/mtf.json web/data/chart-pack.json web/data/paper.json web/data/health.json
          git add web/data/v4-oi.json web/data/v4-radar.json web/data/v4-paper.json
          git add web/data/v4-history-index.json web/data/v4-shadow.json
          git add web/data/v4-lab.json web/data/v4-forward.json web/data/v4-manifest.json
          git add web/data/uzayx-research.json archive/uzayx-research-ledger.json web/data/uzayx-pnl-report.json
          git add archive/closings web/data/uzayx-cash-close.json
          git add archive/uzayx-adaptive-ledger.json web/data/uzayx-adaptive.json web/data/uzayx-strategy-bank.json
          git add web/data/uzayx-guncel.csv
          git add web/data/turan-core.json archive/turan-core-journal.jsonl
          git add web/data/turan-experiments.json archive/turan-experiments-ledger.json archive/turan-cycles research/turan-candles
          git add web/data/v4-watch-archive.json web/data/v4-context.json web/data/v4-early.json web/data/v4-spark-paper.json web/data/v4-spark-review.json
          git add web/data/swing-radar.json web/data/swing-history.json web/data/swing-outcomes.json
          git add archive/epochs
          git add archive/pilot-ledger.json archive/scan-health.json archive/swing-sparks-ledger.json archive/swing-active-ledger.json archive/swing-outcomes-ledger.json
          git add archive/v3-paper-legacy-snapshot.json archive/v4-lifecycle-ledger.json archive/v4-paper-ledger.json archive/v4-shadow-ledger.json archive/v4-forward-ledger.json archive/v4-oi-timeseries.json archive/v4-anomaly-study.json archive/v4-watch-ledger.json archive/v4-context-ledger.json archive/v4-early-ledger.json archive/v4-spark-paper-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: 7-timeframe radar, paper pilot, 90-day event and cron provenance [skip ci]'
          for try in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((try*3))"
          done
          exit 1
      # GITHUB_TOKEN pushes don't trigger downstream push workflows.
      # Publish the verified data and site directly from this scheduled run.
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Upload fresh web site and market archives
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish refreshed UZAYX production site
        id: deployment
        uses: actions/deploy-pages@v5
