name: COIN.LIVE PRO — Public Market & Forward Archive
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/market.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coin-live-pro-market
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only OKX futures scan and forward archive
        run: python3 engine/collector.py
      - name: Verify self-consistency; fail closed
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('web/data')
          files={s:json.loads((p/f'{s}.json').read_text()) for s in ['market','radar','history','reports']}
          now=datetime.datetime.now(datetime.timezone.utc)
          assert len(files['market']['rows']) >= 30
          assert all(x['provider']=='OKX' for x in files.values())
          for key,field in [('market','fetched_at'),('radar','fetched_at'),('history','updated_at'),('reports','updated_at')]:
            age=(now-datetime.datetime.fromisoformat(files[key][field])).total_seconds()
            assert 0<=age<=480,(key,age)
          ev=files['history']['events']
          assert len({x['id'] for x in ev})==len(ev),'duplicate history ids'
          assert all(x['side'] in ('LONG','SHORT') for x in ev)
          print('Verified: 100-pair public radar, events',len(ev),'and 7/14-day reports')
          PY
      - name: Publish only validated data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/market.json web/data/radar.json web/data/history.json web/data/reports.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: forward-only market radar and 7-14 day audit [skip ci]'
          for try in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((try*3))"
          done
          exit 1
      # GITHUB_TOKEN pushes don't trigger downstream push workflows.
      # Publish the verified data and site directly from this scheduled run.
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Upload fresh web site and market archives
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish refreshed COIN.LIVE PRO site
        id: deployment
        uses: actions/deploy-pages@v4
