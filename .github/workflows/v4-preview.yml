name: COIN.LIVE PRO V4 — Isolated Live Read-Only Preview
on:
  workflow_dispatch:
  push:
    branches:
      - v4-lifecycle-desk-20261016
      - v4-production-hardening-20261016
      - v4-90day-ui-final-20261016
      - v4-radar-inpage-chart-kpis-20261016
      - v4-utc-session-release-anomaly-20261017
      - v4-go-archive-context-20261017
      - ui-readable-20261017
      - more-early-signals-20261017
      - ui-ordered-stages-chart-scenarios-20261017
      - ui-minimal-actual-dashboard-20261017
      - v4-02-self-measuring-sparks-20261017
      - v4-03-geldi-daily-paper-audit-20261017
      - fix-mobile-charts-corporate-20261017
    paths:
      - '.github/workflows/v4-preview.yml'
      - 'engine/v4_**'
      - 'tests/test_v4_**'
      - 'web/v4-**'
      - 'web/index.html'
      - 'web/app.js'
      - 'engine/v4_anomaly.py'
      - 'engine/v4_lifecycle.py'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check branch does NOT publish production main
        run: |
          python3 - <<'PY'
          text=open('.github/workflows/market.yml').read()
          assert '  push:\n    branches:\n      - main\n' in text
          PY
      - name: Run real read-only OKX pipeline in throwaway runner only
        run: |
          set -euo pipefail
          python3 engine/collector.py
          python3 engine/v4_context.py
          python3 engine/mtf.py
          python3 engine/spark.py
          python3 engine/v4_oi.py
          python3 engine/v4_lifecycle.py
          python3 engine/v4_paper.py
          python3 engine/v4_shadow.py
          python3 engine/v4_forward.py
          python3 engine/v4_watch_archive.py
          python3 engine/v4_early.py
          python3 engine/v4_spark_paper.py
          python3 engine/v4_spark_review.py
          python3 engine/v4_lab.py
          python3 engine/forward.py
          python3 engine/paper.py
          python3 engine/health.py
          python3 engine/v4_publication.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/data')
          data={k:json.loads((p/(k+'.json')).read_text()) for k in
             ('v4-manifest','v4-radar','v4-history-index','v4-paper','v4-shadow','v4-forward','v4-watch-archive','v4-early','v4-spark-paper','v4-spark-review','v4-context','v4-lab')}
          sid=data['v4-manifest']['scan_id']
          assert data['v4-manifest']['publication_valid']
          anomaly=data['v4-radar'].get('anomaly_research',{})
          assert anomaly.get('not_used_in_v4_score') is True
          assert anomaly.get('no_real_orders') is True
          assert anomaly.get('hourly',{}).get('time_basis')=='UTC'
          assert anomaly.get('clock',{}).get('window_is_not_manipulation_evidence') is True
          pack=json.loads((p/'chart-pack.json').read_text())
          mtf=json.loads((p/'mtf.json').read_text())
          assert pack['schema_version']==1 and pack['source']=='OKX_CLOSED_CANDLES'
          assert pack['source_mtf_at']==pack['fetched_at']==mtf['fetched_at']
          assert set(pack['candles_by_symbol'])=={r['symbol'] for r in mtf['candidates']}
          assert all(len(rows[tf])<=60 for rows in pack['candles_by_symbol'].values() for tf in ('4H','1D'))
          print('MOBILE_CHART_FALLBACK_OK',len(pack['candles_by_symbol']))
          release=json.loads((p.parent/'release.json').read_text())
          assert release['product_version']=='4.03' and release['version_change_owner']=='AUTOMATIC_MINOR_WITHIN_4'
          assert all(data[k]['scan_id']==sid for k in ('v4-radar','v4-history-index','v4-paper','v4-shadow','v4-forward','v4-watch-archive','v4-early','v4-spark-paper','v4-spark-review','v4-lab'))
          assert data['v4-watch-archive']['scan_id']==sid
          assert data['v4-early']['research_only'] is True
          assert data['v4-early']['no_paper_entries'] is True
          assert data['v4-spark-paper']['daily']['timezone']=='UTC'
          assert data['v4-spark-paper']['geldi_intent_total']>=0
          assert data['v4-spark-paper']['daily']['today_utc']==data['v4-spark-paper']['daily']['today']['date_utc']
          assert all(x.get('paper_intent_created_at_utc') and not x.get('is_real_trade') for x in
                     data['v4-spark-paper']['recent_tickets'] if x.get('entry_class')=='GELDI')
          assert data['v4-spark-paper']['daily']['per_event_deduplicated'] is True
          assert data['v4-spark-paper']['no_real_orders'] is True
          assert data['v4-context']['score_not_used_for_paper_or_v4_stage'] is True
          assert data['v4-paper']['starting_balance_usdt']==10000
          assert data['v4-paper']['legacy_v3_balance_included']==False
          assert not data['v4-paper']['open_positions'], 'First-time V4 paper must not fabricate retro fills'
          print('V4_PREVIEW_DATA_PASS',sid,data['v4-radar']['counts'])
          PY
      - name: Chromium renders native three-stage and paper workspace
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory web >/tmp/preview-server.log 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom http://127.0.0.1:8765/ > /tmp/v4-dom.html 2>/tmp/v4-chrome.log
          python3 - <<'PY'
          import re
          doc=open('/tmp/v4-dom.html').read()
          for id in ('v4Spotlight','v4Motion','v4Watch','v4Status'):
              m=re.search(r'id="'+id+r'"[^>]*>(.*?)</',doc,re.S)
              assert m and m.group(1).strip(),id+' failed to render'
          assert 'id="v4Early"' in doc and 'id="v4EarlyCount"' in doc,'Early watch UI missing'
          assert 'id="v4RadarSearch"' in doc and 'id="v4RadarSide"' in doc,'Radar filters missing'
          assert 'ui-refresh.css?v=7' in doc,'Readable CSS layer not linked'
          assert 'V4 veri kontrolü:' not in doc,'V4 manifest fetch or hash validation failed'
          assert 'id="chartScenario"' in doc,'Chart scenario details missing'
          assert 'id="chartDataStatus"' in doc,'Chart origin status missing'
          assert 'id="headerMore"' in doc and 'id="radarMetaDetails"' in doc,'Minimal UX disclosures missing'
          assert 'class="v4MarketSummary"' in doc,'Collapsed stats must remain available'
          assert 'Model ne düşünüyor?' in doc,'Thesis must display'
          assert 'id="sparkCompare"' in doc and 'id="sparkPaperPanel"' in doc,'Comparison and virtual ticket study missing'
          assert 'id="sparkDailyStrip"' in doc,'Today GELDİ and paper PnL missing'
          assert 'id="chartIndicatorsCanvas"' in doc,'Opt-in indicators missing'
          assert 'id="v4PaperKpis"' in doc
          import re
          for target in ('v4MarketTotal','v4LongTotal','v4ShortTotal','v4LastAnalysis'):
              m=re.search(r'id="'+target+r'"[^>]*>(.*?)</',doc,re.S)
              assert m and m.group(1).strip() not in ('—',''), 'Summary KPI missing data: '+target
          assert 'id="v4TopRow"' not in doc  # CSS grid, not duplicated DOM ID
          assert doc.index('id="v4Early"')<doc.index('id="chartHostRadar"')<doc.index('id="sparkStrictDetails"'), '3 stage desk not prominent'
          assert doc.index('id="chartHostRadar"')<doc.index('id="legacyTechnicalDisclosure"'), 'Main chart trapped in closed technical details'
          print('V4_CHROMIUM_RENDER_OK')
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=14000 --dump-dom "http://127.0.0.1:8765/#grafikler" > /tmp/v4-mobile-chart-dom.html 2>/tmp/v4-mobile-chart-chrome.log
          python3 - <<'PY'
          page=open('/tmp/v4-mobile-chart-dom.html').read()
          assert 'data-view="grafikler"' in page and 'id="chartHostAdvanced"' in page
          assert 'id="chartPanel"' in page and 'id="candleChart"' in page
          assert 'chart-pack.json' not in page or 'chartDataStatus' in page
          assert 'id="chartDataStatus"' in page and 'Dış grafikte aç' in page
          print('CHART_MOBILE_WORKSPACE_OK')
          PY
          for pair in '1920,1080:widescreen' '1366,900:desktop' '1024,768:tablet' '768,1024:smalldesktop' '430,932:mobile430' '390,844:mobile' '360,800:mobile360' '320,740:smallmobile'; do
            dimensions=${pair%:*}
            label=${pair#*:}
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$dimensions" --virtual-time-budget=15000 --screenshot="/tmp/v4-$label.png" "http://127.0.0.1:8765/#portfoy" >/dev/null 2>/dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-isolated-read-only-preview
          path: |
            /tmp/v4-dom.html
            /tmp/v4-mobile-chart-dom.html
            /tmp/v4-mobile-chart-chrome.log
            /tmp/v4-chrome.log
            /tmp/v4-desktop.png
            /tmp/v4-mobile.png
            /tmp/v4-smallmobile.png
            /tmp/v4-mobile360.png
            /tmp/v4-mobile430.png
            /tmp/v4-tablet.png
            /tmp/v4-smalldesktop.png
            /tmp/v4-widescreen.png
            web/data/v4-manifest.json
            web/data/v4-radar.json
            web/data/v4-paper.json
            web/data/v4-forward.json
            web/data/v4-shadow.json
            web/data/v4-lab.json
          retention-days: 7
