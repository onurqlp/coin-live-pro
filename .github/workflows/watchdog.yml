name: COIN.LIVE — Independent Pipeline Watchdog
on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watchdog.yml'
      - 'scripts/watchdog.py'
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check latest published scan and consecutive failures; dedupe GitHub Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.COINLIVE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.COINLIVE_TELEGRAM_CHAT_ID }}
        run: python3 scripts/watchdog.py
